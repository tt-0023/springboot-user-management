spring:
  datasource:
    url: jdbc:mysql://localhost:3306/users?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
# 配置pagehelper
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql
  # mybatis配置
mybatis-plus:
    mapper-locations: classpath:mapper/*.xml
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
        db-config:
          logic-delete-field: deleted
          logic-delete-value: 1   # 删除值
          logic-not-delete-value: 0 # 未删除
#knife4j配置：
knife4j:
  #开启增强
  enable:
  #关闭生产环境保护（本地开发false)
  production: false



